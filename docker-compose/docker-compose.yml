# Copy .env.example to .env and set USERNAME and PASSWORD there.
services:
  webdav:
    image: ghcr.io/moerchel/docker-webdav:latest
    container_name: webdav
    restart: unless-stopped
    ports:
      # Only reachable from this host, e.g. for a reverse proxy with TLS.
      # Use "8080:80" to make it reachable from the network.
      - "127.0.0.1:8080:80"
    volumes:
      - ./data:/media/data
      - ./logs:/media/logs
    environment:
      USERNAME: ${USERNAME:-}
      PASSWORD: ${PASSWORD:-}
