# The log files in /media/logs only get failed requests (status 4xx and 5xx)
map $status $loggable {
    ~^[23]  0;
    default 1;
}

# nginx handles directories only with a trailing slash, for MKCOL, DELETE,
# COPY and MOVE as well as in the Destination header. Many clients leave it
# out, so it is added below. Not for GET/HEAD: there nginx redirects to the
# URL with slash, so the relative links of the directory listing work.
map $request_method $webdav_dir_method {
    GET     0;
    HEAD    0;
    default 1;
}
map $http_destination $webdav_destination_dir {
    ~^(.*[^/])$ $1/;
    default     $http_destination;
}

# Locks for LOCK/UNLOCK (needed by macOS Finder and Windows for writing)
dav_ext_lock_zone zone=webdav:10m;

server {
    listen 80 default_server;
    root /media/data;
    client_max_body_size 0;

    # Trusted proxies from TRUSTED_PROXIES, written by entrypoint.sh
    include /etc/nginx/webdav/realip.conf;

    access_log /media/logs/access.log combined if=$loggable;
    access_log /dev/stdout combined;
    error_log /media/logs/error.log error;
    error_log /dev/stderr warn;

    # Health check, without authentication and logging
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        # Basic authentication from USERNAME/PASSWORD or HTPASSWD_FILE,
        # written by entrypoint.sh (empty without authentication)
        include /etc/nginx/webdav/auth.conf;

        create_full_put_path on;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=webdav;
        dav_access user:rw group:rw all:r;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;

        # Trailing slash for directories, see above
        set $webdav_slash "";
        if ($webdav_dir_method) {
            set $webdav_slash "m";
        }
        if (-d $request_filename) {
            set $webdav_slash "${webdav_slash}d";
        }
        if ($request_method = MKCOL) {
            set $webdav_slash "md";
        }
        if ($webdav_slash = "md") {
            rewrite ^(.*[^/])$ $1/ break;
            more_set_input_headers "Destination: $webdav_destination_dir";
        }
    }
}
