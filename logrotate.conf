# Run by entrypoint.sh every hour, the files are rotated once a day
/media/logs/*.log {
    su root root
    daily
    dateext
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0644 www-data www-data
    sharedscripts
    postrotate
        [ -s /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}
